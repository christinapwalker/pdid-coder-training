<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDID Coder Training</title>
<style>
/* ============================================================
   PDID CODER TRAINING: visual tokens
   Case-file / field-ledger aesthetic: this is an evidence log for
   coding decisions, not a SaaS dashboard. Numbering in the nav is
   intentional; it mirrors the codebook's own section numbers.
   ============================================================ */
:root{
  --paper:#F1EEE6;
  --paper-dim:#E8E3D6;
  --card:#FBFAF6;
  --ink:#22262B;
  --ink-soft:#5B5E58;
  --line:#CBC3B2;
  --line-soft:#DCD6C7;
  --red:#8C3B33;
  --red-bg:#F3E4E1;
  --green:#3F6E58;
  --green-bg:#E4EDE7;
  --amber:#A5761F;
  --amber-bg:#F1E7CF;
  --navy:#2B3A4A;
  --navy-bg:#E1E7EC;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
body{display:flex;min-height:100vh;}
a{color:var(--navy);}

/* ---------- layout ---------- */
#sidebar{
  width:250px;flex-shrink:0;background:var(--paper-dim);
  border-right:1px solid var(--line);padding:20px 0 20px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
#main{flex:1;padding:36px 44px 80px;max-width:880px;}
@media (max-width:820px){
  body{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:relative;}
  #main{padding:24px 20px 60px;max-width:100%;}
}

.brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand h1{font-family:var(--serif);font-size:19px;margin:0 0 2px;line-height:1.25;}
.brand p{font-size:12.5px;color:var(--ink-soft);margin:0;}

.navgroup{margin-top:14px;}
.navlabel{font-size:11px;color:var(--ink-soft);padding:0 20px;margin-bottom:6px;letter-spacing:.02em;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;
  font-size:14px;border-left:3px solid transparent;color:var(--ink);
}
.navitem:hover{background:var(--card);}
.navitem.active{background:var(--card);border-left-color:var(--red);font-weight:600;}
.navnum{
  font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
  width:18px;text-align:right;flex-shrink:0;
}
.navcheck{margin-left:auto;font-size:12px;color:var(--green);}

/* ---------- content blocks ---------- */
.eyebrow{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
h2.title{font-family:var(--serif);font-size:29px;margin:0 0 6px;line-height:1.2;}
.tagline{color:var(--ink-soft);font-size:15px;margin:0 0 28px;max-width:560px;}

.card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:2px;
  padding:20px 24px;margin-bottom:18px;
}
.card h3{font-family:var(--serif);font-size:18px;margin:0 0 10px;}
.card p{font-size:14.5px;line-height:1.6;margin:0 0 10px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.card ul{margin:0 0 10px;padding-left:20px;font-size:14.5px;line-height:1.6;}

.callout{
  border-left:3px solid var(--navy);background:var(--navy-bg);
  padding:12px 16px;font-size:14px;line-height:1.55;margin:14px 0;border-radius:1px;
}
.callout.warn{border-left-color:var(--amber);background:var(--amber-bg);}
.callout.example{border-left-color:var(--green);background:var(--green-bg);}
.callout b{display:block;font-size:12px;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}

.expand{border:1px dashed var(--line);border-radius:2px;margin:12px 0;background:var(--paper-dim);}
.expand summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--navy);list-style:none;}
.expand summary::-webkit-details-marker{display:none;}
.expand summary::before{content:'▸';display:inline-block;margin-right:6px;transition:transform .15s;}
.expand[open] summary::before{transform:rotate(90deg);}
.expand .expandbody{padding:0 14px 14px;font-size:14px;line-height:1.6;color:var(--ink);}
.expand .expandbody p{margin:0 0 8px;}
.expand .expandbody p:last-child{margin-bottom:0;}

.fieldtag{
  font-family:var(--mono);font-size:12px;background:var(--paper-dim);
  border:1px solid var(--line);padding:1px 6px;border-radius:3px;
}

/* ---------- quiz ---------- */
.quizblock{border-top:1px dashed var(--line);margin-top:22px;padding-top:18px;}
.qhead{font-family:var(--serif);font-size:16px;margin:0 0 14px;}
.question{margin-bottom:22px;}
.qprompt{font-size:14.5px;font-weight:600;margin-bottom:10px;}
.choice{
  display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line-soft);
  border-radius:2px;margin-bottom:6px;cursor:pointer;font-size:14px;background:var(--card);
}
.choice:hover{border-color:var(--line);}
.choice input{margin-top:3px;}
.choice.correct{border-color:var(--green);background:var(--green-bg);}
.choice.incorrect{border-color:var(--red);background:var(--red-bg);}
.checkbtn, .actionbtn{
  font-family:var(--sans);font-size:13.5px;background:var(--navy);color:#fff;border:none;
  padding:8px 16px;border-radius:2px;cursor:pointer;
}
.checkbtn:hover, .actionbtn:hover{opacity:.9;}
.checkbtn:disabled{background:var(--line);cursor:default;}
.explain{font-size:13.5px;margin-top:8px;padding:10px 12px;background:var(--paper-dim);border-radius:2px;display:none;line-height:1.55;}
.explain.show{display:block;}
.quizscore{font-size:14px;margin-top:10px;padding:10px 14px;background:var(--paper-dim);border-radius:2px;display:none;}
.quizscore.show{display:block;}

/* ---------- airtable guide ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0;}
.tbl th,.tbl td{border-bottom:1px solid var(--line-soft);text-align:left;padding:7px 8px;vertical-align:top;}
.tbl th{color:var(--ink-soft);font-weight:600;font-size:12.5px;}

.grid2x2{display:grid;grid-template-columns:100px 1fr 1fr;gap:1px;background:var(--line-soft);margin:12px 0;border:1px solid var(--line-soft);}
.grid2x2 > div{background:var(--card);padding:10px 12px;font-size:13px;line-height:1.5;}
.g2-corner{background:var(--paper-dim);}
.g2-colhead,.g2-rowhead{background:var(--paper-dim);font-weight:600;color:var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;}
.g2-cell b{font-family:var(--mono);font-size:11.5px;display:block;margin-bottom:4px;color:var(--navy);}

/* ---------- practice lab ---------- */
.postcard{border:1px solid var(--line);background:var(--card);padding:16px 18px;margin-bottom:18px;}
.postmeta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.postcaption{font-style:italic;font-size:14px;margin:8px 0;}
.posttranscript{font-size:13.5px;background:var(--paper-dim);padding:10px 12px;margin-top:8px;border-radius:2px;max-height:160px;overflow-y:auto;}

.formfield{margin-bottom:16px;}
.flabel{font-size:13.5px;font-weight:600;margin-bottom:5px;display:block;}
.fhint{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.optrow{display:flex;flex-wrap:wrap;gap:6px;}
.opt{
  font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:4px 11px;
  cursor:pointer;background:var(--card);user-select:none;
}
.opt.on{background:var(--navy);color:#fff;border-color:var(--navy);}
input[type=text], textarea{
  width:100%;font-family:var(--sans);font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
  border-radius:2px;background:#fff;
}
textarea{min-height:60px;resize:vertical;}

.gradebox{border:1px solid var(--line-soft);padding:10px 14px;margin-top:6px;border-radius:2px;font-size:13px;display:none;}
.gradebox.show{display:block;}
.gradebox.pass{border-color:var(--green);background:var(--green-bg);}
.gradebox.partial{border-color:var(--amber);background:var(--amber-bg);}
.gradebox.fail{border-color:var(--red);background:var(--red-bg);}

.scoresummary{font-family:var(--serif);font-size:22px;margin:14px 0;}
.excludenote{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:12px;margin-top:18px;}

.progressrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
.pill{font-size:11.5px;padding:2px 9px;border-radius:10px;background:var(--paper-dim);}
.pill.done{background:var(--green-bg);color:var(--green);}
</style>
</head>
<body>
<div id="sidebar"></div>
<div id="main"></div>

<script>
/* ============================================================
   HOW TO KEEP THIS UPDATED
   ------------------------------------------------------------
   Everything a coder reads (every definition, decision rule,
   quiz question, and Airtable field note) lives in the two data
   objects below: CODEBOOK and AIRTABLE_GUIDE. If the real
   codebook or the Airtable base changes, edit the TEXT inside
   these objects. You never need to touch the rendering code
   below them (search for "RENDERING ENGINE").
   ============================================================ */

const CODEBOOK = {
  modules: [
    {
      id:'m1', num:'1', title:'General Instructions',
      tagline:'This section walks you through the different units of analysis (events, incidents, reports) along with the three actor types and three harm fields.',
      teach:[
        {h:'Three units of analysis', p:'• An <b>event</b> is the broad political episode or controversy (a debate, a scandal, an election).<br>• An <b>incident</b> is one distinct image, video, or audio item.<br>• A <b>report</b> is one coded appearance of that item in one specific post.<br>• One incident can appear in many reports; one event can span many incidents.'},
        {h:'Same incident or new incident?', p:'Cropping, compressing, resizing, watermarking, or a different caption on the same underlying media = same incident, new report. Substantively altering the media itself (adding people, adding new frames, changing what it appears to show) creates a new incident.', expand:{title:'Worked examples: same incident vs. new incident', body:'<p>An image posted on X, then later uploaded to Facebook with different cropping, compression, or a small source label, stays one incident with two reports (one per platform).</p><p>Adding people onto an image, or adding new frames/sequences onto a video, creates a new incident, even though the original media is still recognizable inside it.</p><p>Can\u2019t confirm whether it matches an existing incident? Create a new one and note the possible duplicate in the relevant comments field rather than guessing.</p>'}},
        {h:'Don\u2019t over-group into events', p:'Only attach an incident to an event when it belongs to the same recognizable episode. Sharing a politician, country, or topic is not enough on its own.', expand:{title:'Common pitfall: forcing incidents into events that don\u2019t fit', body:'<p>Not every incident needs an event, and one incident can belong to more than one event if it genuinely spans multiple episodes.</p><p>Don\u2019t create a separate event for a passing meme, joke, or social media trend, that\u2019s already captured elsewhere in the database. And don\u2019t group incidents together just because they share a politician, country, or policy topic, that\u2019s a coincidence, not a shared episode.</p><p>If you\u2019re confident a real event is missing from the list, select Other and describe it for project-lead review rather than forcing it into the closest existing option.</p>'}},
        {h:'The three actor roles', p:'• <b>Original source</b>: who created or first posted it.<br>• <b>Sharer</b>: the specific account at the URL you\u2019re coding right now.<br>• <b>Target</b>: who the deepfake depicts or harms.<br>• The original source and sharer are often the same person, when they are, code them identically in each section rather than leaving anything blank.'},
        {h:'The three harm/depiction fields', p:'• <b>Content Depicted</b> asks what the media is about.<br>• <b>Harm Depicted</b> asks what harm is shown or implied inside the media.<br>• <b>Harm Evidence</b> asks what harm actually happened in the real world afterward, this can only be coded from real evidence.'}
      ],
      quiz:[
        {q:'A deepfake video is posted on Twitter, then a fact-checker reposts the identical video with a watermark added on TikTok. How many incidents and reports is that?',
         choices:['1 incident, 1 report','1 incident, 2 reports','2 incidents, 2 reports','2 incidents, 1 report'],
         correct:1, explain:'A watermark is a minor presentational change, so it stays the same incident. A separate posting on a different platform is a new report.'},
        {q:'Someone takes a real photo of a senator and adds two people into the image who weren\u2019t there originally. Same incident, or new?',
         choices:['Same incident, it\u2019s the same base photo','New incident, the edit substantively changes the media\u2019s content','New report only, not a new incident','A new event, since it\u2019s now a different scene'],
         correct:1, explain:'Adding people or frames materially changes what the media shows, which crosses the line from "same incident, new report" into "new incident."'},
        {q:'The sharer of a video is also the person who first posted it. How do you code the original source fields?',
         choices:['Leave them blank since it\u2019s redundant','Code original source identically to the sharer fields','Mark original source as Unknown','Only fill in the target fields'],
         correct:1, explain:'When the same person fills two roles, code both sections the same way rather than skipping one.'},
        {q:'A video shows a candidate being attacked (staged, inside the deepfake). News outlets later report that the video incited a real assault at a rally. Which field captures the real assault?',
         choices:['Content Depicted','Harm Depicted','Harm Evidence','Comments on Content & Topic Coding'],
         correct:2, explain:'Harm Depicted is what\u2019s shown inside the media (the staged attack); Harm Evidence is the real-world consequence, which needs external evidence.'}
      ]
    },
    {
      id:'m2', num:'2', title:'Administrative Fields',
      tagline:'',
      teach:[
        {h:'Event Name / Other Event Name', p:'Multi-select from the existing event list, and only when the incident meaningfully belongs to that broader episode. Don\u2019t group incidents just because they share a politician, country, or topic, and don\u2019t create an event for a passing meme or trend. If a genuinely new event seems to be missing, select Other and describe it in Other Event Name for project-lead review. Use NA if nothing applies.'},
        {h:'Incident ID', p:'Search existing incidents before creating a new one. This is a linked-record field, not free text. Use the same Incident ID whenever the underlying media matches an existing incident.'},
        {h:'Incident Title', p:'Describe the media itself, neutrally ("appears to show"), never the account, caption, platform, or engagement numbers. No usernames unless they appear inside the media.<br><br><b>A good Incident Title:</b> "AI-generated image appears to show Candidate X accepting a bribe," not "@RandomUser’s viral post about the senator."'},
        {h:'Report ID', p:'You’ll need to enter this number yourself; it’s shown in your task tab. One per distinct post or upload: the original post, an independent re-upload, or a cross-platform upload. Do <b>not</b> create a new report for an ordinary native retweet or a quote-tweet with no added context.', expand:{title:'Judgment call: does this count as a new report?', body:'<p>A quote-tweet or repost with no added context is not a new report, it’s the kind of engagement already captured in the Engagement Metrics fields.</p><p>A quote-tweet with added context, an independent re-upload by a different account, or a cross-platform posting all count as separate reports of the same incident.</p><p>When in doubt, ask: is this a genuinely separate posting someone could find and engage with on its own, or just a reaction to the report you already have?</p>'}},
        {h:'Tags', p:'Public-site tags used for filtering and search on the project website. Select any that apply from the shared list; use NA if none apply.'}
      ],
      quiz:[
        {q:'A deepfake is clearly part of a well-known, ongoing political scandal that\u2019s already in the event list. What do you do with Event Name?',
         choices:['Leave it blank since incidents don\u2019t need events','Select the matching event from the list','Create a new event anyway to be safe','Only code it if you personally followed the story'],
         correct:1, explain:'Search the existing list first, and only use Other/propose a new one when nothing recognizable fits.'}
      ]
    },
    {
      id:'m3', num:'3', title:'Media & File Fields',
      tagline:'',
      teach:[
        {h:'URL', p:'Paste the URL of the content. If the post has since been deleted, record the URL anyway. Don\u2019t skip it.'},
        {h:'Platform', p:'Single-select: twitter_x, facebook, youtube, reddit, tiktok, truth_social, bluesky, threads, whatsapp, telegram, or Other.'},
        {h:'File vs. Screenshot', p:'<span class="fieldtag">file</span> is the original image/video itself. Download it, never submit a screenshot. <span class="fieldtag">screenshot</span> is a separate upload showing how the post looked in context: account name, date posted, and engagement numbers if visible. They answer different questions and both may be needed.'},
        {h:'Date Posted', p:'Use the date visible on the post itself, formatted YYYY-MM-DD. If only a month and year are visible, record what you can and note the uncertainty in the comments/context field.'},
        {h:'Format', p:'image, video, or audio, though the project currently only collects video and image.'},
        {h:'Transcript', p:'Transcribe spoken or written content in its original language (write NA if there\u2019s none).'}
      ],
      quiz:[
        {q:'You\u2019ve downloaded the video you need to code. What goes in the File field?',
         choices:['A screenshot of the video as it appeared on the platform','The original video file itself, not a screenshot','A link to the video','A written description of the video'],
         correct:1, explain:'File is the original media; screenshots belong in the separate Screenshot field.'},
        {q:'What does the Screenshot field capture that the File field doesn\u2019t?',
         choices:['Nothing, they\u2019re redundant','How the post looked in context: account name, date, and visible engagement','A backup copy of the video','The transcript'],
         correct:1, explain:'Screenshot documents in-context appearance; File is the raw media.'},
        {q:'A post you\u2019re coding only shows a month and year, no exact day. What do you do for Date Posted?',
         choices:['Leave it blank','Record what you can and note the uncertainty in comments','Guess a specific day','Use today\u2019s date'],
         correct:1, explain:'Partial information still gets recorded; flag the gap rather than guessing or skipping.'},
        {q:'Which content formats does this project currently collect?',
         choices:['Video and image only','Audio only','Video, image, and audio','Text only'],
         correct:0, explain:'Audio is a defined format option for future use, but coding is currently limited to video and image.'}
      ]
    },
    {
      id:'m4', num:'4', title:'Engagement Metrics',
      tagline:'',
      teach:[
        {h:'Record numbers as shown', p:'Enter the numbers exactly as they appeared on the post at the time of coding. Expand abbreviations: "1.2K" becomes 1200.'},
        {h:'Likes / Views / Comments / Shares', p:'Each field maps to that platform\u2019s equivalent (favorites count as Likes, retweets/reposts count as Shares, and so on). Use NA only when the platform genuinely doesn\u2019t have that feature, not when the number is simply zero.'}
      ],
      quiz:[
        {q:'The post shows "3.4K" likes. What do you record in the Likes field?',
         choices:['"3.4K" verbatim','3400','NA','Round to 3000'],
         correct:1, explain:'Approximations should be expanded to their full numeric form.'},
        {q:'A platform doesn\u2019t have a "Views" counter at all for this kind of post. What do you enter?',
         choices:['0','Leave it blank','NA','Estimate based on likes'],
         correct:2, explain:'NA is for features the platform doesn\u2019t have; 0 would misrepresent an actual zero count.'},
        {q:'A post genuinely shows 0 comments. What do you record?',
         choices:['NA, since there\u2019s nothing to show','0','Leave it blank','Skip the field'],
         correct:1, explain:'A real zero is still a number. NA is reserved for platforms lacking the feature entirely, not for an actual zero count.'}
      ]
    },
    {
      id:'m5', num:'5', title:'Original Source Fields',
      tagline:'Who created or first posted the media, not necessarily the account you found it through.',
      teach:[
        {h:'Original Source Name / Username', p:'The account or outlet that first created or posted the deepfake, not necessarily the specific account you found it through. Select from the dropdown if listed; otherwise use the "other" text field.<br><br>Original Source Name is the actual name the person or outlet goes by, their display name, not their handle. The @handle goes in the separate Original Source Username field.'},
        {h:'Original Source Actor Type', p:'The category of who created it.<br><br>• <b>political_figure</b> (Political leader/figure): an elected official, candidate, or prominent political figure.<br>• <b>government</b> (Government entity): an official government body or institution, not an individual.<br>• <b>private_ngo</b> (Private/NGO): a private individual, company, or NGO.<br>• <b>individual</b> (Individual): a generic individual or random user not fitting the above categories.<br>• <b>unclear</b> (Unclear): cannot determine.'},
        {h:'Original Source Country', p:'Based on the source\u2019s profile. Use the "other" field if not listed, or NA if you can\u2019t determine it.'},
        {h:'When source and sharer are the same', p:'Code them identically in both sections rather than leaving one blank.'},
        {h:'When the source is unknown', p:'Code Original Source Name as NA, Original Source Actor Type as unclear, and explain your reasoning in Comments on Coding of the Original Source. Don\u2019t guess based on style or vibe.'}
      ],
      quiz:[
        {q:'You can\u2019t determine who first created a video. You only found it being shared by a news account. What do you do?',
         choices:['Code the news account as both source and sharer','Code Original Source as NA / unclear and explain in comments','Leave the source fields blank','Guess based on the video\u2019s style'],
         correct:1, explain:'When the source truly can\u2019t be confirmed, say so explicitly rather than leaving it blank or guessing.'},
        {q:'The original source\u2019s profile identifies them as a national government press office. What\u2019s the best Original Source Actor Type?',
         choices:['individual','government','private_ngo','unclear'],
         correct:1, explain:'An official government body or institution, not an individual, maps to government.'},
        {q:'The sharer of a video turns out to also be the person who filmed and first posted it. How do you code Original Source Name?',
         choices:['Leave it blank since it\u2019s the same as the sharer','Code it identically to the sharer fields','Mark it Unknown since it\u2019s ambiguous','Only fill in the sharer fields'],
         correct:1, explain:'When source and sharer are the same person, code both sections the same way.'}
      ]
    },
    {
      id:'m6', num:'6', title:'Sharer Fields',
      tagline:'The specific account whose post you\u2019re coding right now: their reach, role, and location.',
      teach:[
        {h:'Sharer Name / Username', p:'The account currently sharing the content at the URL you\u2019re coding, not necessarily the original creator.<br><br>Sharer Name is the actual name the person or outlet goes by, their display name, not their handle. The @handle goes in the separate Sharer Username field.'},
        {h:'Sharer Type is about reach, not job', p:'A 2×2 of offline fame × follower count, split at the 100,000-follower line: low_fame_low_followers, low_fame_high_followers, high_fame_low_followers, high_fame_high_followers, or Unclear if you can\u2019t tell.', expand:{title:'The fame × followers grid, spelled out', body:'<div class="grid2x2"><div class="g2-corner"></div><div class="g2-colhead">Low Followers<br>(under 100K)</div><div class="g2-colhead">High Followers<br>(over 100K)</div><div class="g2-rowhead">High Fame</div><div class="g2-cell"><b>high_fame_low_followers</b>The individual is widely recognized offline and has less than 100,000 followers.</div><div class="g2-cell"><b>high_fame_high_followers</b>Widely recognized offline and over 100,000 followers, e.g. a sitting head of state’s verified account.</div><div class="g2-rowhead">Low Fame</div><div class="g2-cell"><b>low_fame_low_followers</b>The individual is not widely known offline and the account has less than 100,000 followers at the time of posting.</div><div class="g2-cell"><b>low_fame_high_followers</b>The individual is not widely known offline and has more than 100,000 followers.</div></div><p><b>Unclear</b>: unknown, cannot identify the account type.</p><p>The 100,000-follower line is the exact threshold the codebook uses, don’t eyeball it.</p>'}},
        {h:'Sharer Job is the separate field for role', p:'politician, public_figure, journalist, researcher_academic, random_user, other, or unclear: their actual professional role, independent of fame or followers.'},
        {h:'Sharer Country', p:'Based on the sharer\u2019s profile or the post context. Use the "other" field if not listed.'}
      ],
      quiz:[
        {q:'A meme account with 2M followers, not well known offline, shares a deepfake. What\u2019s their Sharer Type?',
         choices:['high_fame_high_followers','low_fame_high_followers','low_fame_low_followers','high_fame_low_followers'],

        {h:'Visual Style codes appearance, not truth', p:'realistic / uncanny / exaggerated / meme-ified / unclear describe how the media looks, not whether you believe it\u2019s authentic. A photorealistic fake is still "realistic."<br><br>\u2022 <b>Realistic</b>: the content appears visually similar to a real photograph or video frame, regardless of whether it is authentic. Example: a photorealistic image of a candidate speaking at a podium.<br>\u2022 <b>Uncanny</b>: content does not quite look authentic, although it may be difficult to determine exactly which aspect makes this clear. Example: clips of presidents with faces that are too smooth to reflect reality.<br>\u2022 <b>Exaggerated</b>: content has one or two features that make it clear the content is not authentic. Example: exaggerating the size of a candidate\u2019s head, or noticeably distorting the context of the presentation beyond realistic means.<br>\u2022 <b>Meme-ified</b>: clearly fictionalized content that exaggerates the imagery presented near totality. Example: memes and other forms of visual content that rely on comedic distortions.'},

        {h:'The final call: Content Type + Confidence Tier', p:'After weighing internal cues, labeling, detection scores, and external verification: deepfake (AI-generated/altered identity media), cheapfake (simple/low-tech editing), real (authentic), or uncertain_or_mixed (insufficient/conflicting evidence). Confidence Tier reflects the strength of the evidence, not how convincing the fake feels.', expand:{title:'Why visual_style, external_verification, and content_type don’t always agree', body:'<p>These are three separate calls, and it’s normal for them to point in different directions before you make the final content_type decision.</p><p>visual_style is about how it looks (realistic, uncanny, exaggerated, meme-ified), regardless of what you believe. external_verification is about what credible outside sources have concluded, if anything. content_type is your final synthesis of internal cues, labeling, detection scores, and external verification together.</p><p>A stylized or artistic-looking depiction can still be coded deepfake if it’s an AI-generated depiction of a real person, looking obviously edited doesn’t automatically make something a cheapfake instead. And confidence_tier is about how strong the evidence is, not about how convincing the fake feels to you personally.</p>'}}

const STORAGE_PREFIX = 'pdid_training:';
let progressCache = {};

async function loadProgress(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(STORAGE_PREFIX)===0){
        try{ progressCache[k] = JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
  }catch(e){ /* storage unavailable; training still works, just won't persist */ }
}
async function saveProgress(key, value){
  const fullKey = STORAGE_PREFIX + key;
  progressCache[fullKey] = value;
  try{ localStorage.setItem(fullKey, JSON.stringify(value)); }catch(e){}
}
async function resetProgress(){
  for(const k of Object.keys(progressCache)){
    try{ localStorage.removeItem(k); }catch(e){}
  }
  progressCache = {};
  render();
}

let currentView = 'home';

function moduleDone(m){
  const p = progressCache[STORAGE_PREFIX+'quiz:'+m.id];
  return p && p.score === p.total;
}

    html += `<div class="callout ${m.callout.type||''}"><b>${m.callout.title}</b>${m.callout.body}</div>`;

const QUIZ_PROXY_URL = 'https://pdid-quiz-proxy.walke667.workers.dev';
function getRAName(){
  let name = progressCache[STORAGE_PREFIX+'raName'];
  if(!name){
    name = (window.prompt('What’s your name? We’ll use this to send your quiz scores to the team.') || '').trim();
    if(name) saveProgress('raName', name);

function wireModuleQuiz(m){
  const container = document.getElementById('quiz-'+m.id);
  if(!container) return;
  const scoreEl = document.getElementById('score-'+m.id);
  const sendReminder = document.getElementById('sendreminder-'+m.id);
  const sendBtn = document.getElementById('sendbtn-'+m.id);
  const sendMsg = document.getElementById('sendmsg-'+m.id);

  function showCompletion(score, total){
    scoreEl.textContent = `Module score: ${score} / ${total}`;
    scoreEl.classList.add('show');
    sendBtn.style.display = 'inline-block';
    const alreadySent = progressCache[STORAGE_PREFIX+'quiz:'+m.id] && progressCache[STORAGE_PREFIX+'quiz:'+m.id].sent;
    if(alreadySent){
      sendReminder.style.display = 'none';
      sendMsg.textContent = 'Score already sent to the team for this module.';
      sendMsg.classList.add('show');
    } else {
      sendReminder.style.display = 'block';
    }
  }

  sendBtn.addEventListener('click', async ()=>{
    const raName = getRAName();
    if(!raName) return;
    const moduleLabel = `${m.num}. ${m.title}`;
    const saved = progressCache[STORAGE_PREFIX+'quiz:'+m.id] || {score:0, total:m.quiz.length};
    sendBtn.disabled = true;
    sendMsg.textContent = 'Sending…';
    sendMsg.classList.add('show');
    try{
      const res = await fetch(QUIZ_PROXY_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ raName, module: moduleLabel, score: saved.score, total: saved.total })
      });
      if(!res.ok) throw new Error('proxy error');
      sendMsg.textContent = 'Score sent to the team.';
      sendReminder.style.display = 'none';
      saveProgress('quiz:'+m.id, {...saved, sent:true}).then(renderSidebar);
    }catch(e){
      sendMsg.textContent = 'Couldn’t send automatically. Try again in a moment, or let your team lead know if it keeps failing.';
    }
    sendBtn.disabled = false;
  });

  const results = {};
  const saved = progressCache[STORAGE_PREFIX+'quiz:'+m.id];
  if(saved && saved.results){
    Object.keys(saved.results).forEach(qiStr=>{
      if(!saved.results[qiStr]) return;
      const qi = parseInt(qiStr);
      const q = m.quiz[qi];
      const qDiv = container.querySelector(`.question[data-qi="${qi}"]`);
      if(!qDiv || !q) return;
      qDiv.querySelectorAll('.choice').forEach(ch=>{
        const ci = parseInt(ch.dataset.ci);
        ch.querySelector('input').disabled = true;
        if(ci===q.correct) ch.classList.add('correct');
      });
      const exp = document.getElementById(`explain-${m.id}-${qi}`);
      exp.textContent = 'Correct. ' + q.explain;
      exp.classList.add('show');
      const qbtn = qDiv.querySelector('.checkbtn');
      if(qbtn) qbtn.disabled = true;
      results[qi] = true;
    });
  }
  if(m.quiz.length > 0 && Object.keys(results).length === m.quiz.length){
    showCompletion(saved.score, saved.total);
  }

  container.querySelectorAll('.checkbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qi = parseInt(btn.dataset.qi);
      const q = m.quiz[qi];
      const qDiv = container.querySelector(`.question[data-qi="${qi}"]`);
      const picked = qDiv.querySelector('input:checked');
      if(!picked){ return; }
      const val = parseInt(picked.value);
      const exp = document.getElementById(`explain-${m.id}-${qi}`);
      if(val !== q.correct){
        qDiv.querySelectorAll('.choice').forEach(ch=>{
          const ci = parseInt(ch.dataset.ci);
          ch.classList.toggle('incorrect', ci===val);
        });
        exp.textContent = 'Not quite, try again.';
        exp.classList.add('show');
        return;
      }
      qDiv.querySelectorAll('.choice').forEach(ch=>{
        const ci = parseInt(ch.dataset.ci);
        ch.querySelector('input').disabled = true;
        ch.classList.remove('incorrect');
        if(ci===q.correct) ch.classList.add('correct');
      });
      exp.textContent = 'Correct. ' + q.explain;
      exp.classList.add('show');
      btn.disabled = true;
      results[qi] = true;
      const answered = Object.keys(results).length;
      const score = Object.values(results).filter(Boolean).length;
      saveProgress('quiz:'+m.id, {score, total:m.quiz.length, results}).then(renderSidebar);
      if(answered === m.quiz.length){
        showCompletion(score, m.quiz.length);
      }
    });
  });
}

function normalize(s){ return (s||'').toLowerCase().trim().replace(/[\s_-]+/g,'_'); }
function gradeSingle(given, gold){
  if(!given) return {ok:false, msg:'No answer selected. Gold standard: '+gold};
  const equiv = normalize(given)===normalize(gold) ||
    (normalize(given).includes('disputed') && normalize(gold).includes('disputed'));
  return {ok:equiv, msg: equiv ? 'Correct.' : `You selected "${given}". Gold standard: "${gold}".`};
}
function gradeMulti(given, gold){
  const g = given.map(normalize), gd = gold.map(normalize);
  const matched = gd.filter(x=>g.includes(x));
  const missed = gd.filter(x=>!g.includes(x));
  const extra = g.filter(x=>!gd.includes(x));
  const full = missed.length===0 && extra.length===0;
  const partial = matched.length>0 && !full;
  let msg = `Matched: ${matched.join(', ')||'none'}.`;
  if(missed.length) msg += ` Missed: ${missed.join(', ')}.`;
  if(extra.length) msg += ` Extra (not in gold standard): ${extra.join(', ')}.`;
  return {ok: full ? 'full' : (partial ? 'partial' : 'fail'), msg};
}

function gradeIncident(incId){
  const inc = PRACTICE_INCIDENTS.find(i=>i.id===incId);
  const s = practiceState[incId];
  const g = inc.gold;
  let rows = [];
  let fullCount = 0, totalGraded = 0;

  function tallySingle(label, given, gold){
    totalGraded++;
    const r = gradeSingle(given, gold);
    if(r.ok) fullCount++;
    rows.push(`<div><b>${label}:</b> ${r.ok?'\u2713':'\u2717'} ${r.msg}</div>`);
  }
  function tallyMulti(label, given, gold){
    totalGraded++;
    const r = gradeMulti(given, gold);
    if(r.ok==='full') fullCount++;
    else if(r.ok==='partial') fullCount += 0.5;
    rows.push(`<div><b>${label}:</b> ${r.ok==='full'?'\u2713':(r.ok==='partial'?'\u25CF partial':'\u2717')} ${r.msg}</div>`);
  }

  tallyMulti('Content Depicted', s.contentDepicted, g.contentDepicted);
  tallyMulti('Harm Depicted', s.harmDepicted, g.harmDepicted);
  totalGraded++;
  const nameOk = s.targetName && normalize(s.targetName).includes(normalize(g.targetName).split('_')[0]);
  if(nameOk) fullCount++;
  rows.push(`<div><b>target_one_name:</b> ${nameOk?'\u2713':'\u2717'} You wrote "${s.targetName||'(blank)'}". Gold standard: "${g.targetName}".</div>`);
  tallySingle('target_one_sentiment', s.targetSentiment, g.targetSentiment);
  tallySingle('target_one_type_micro', s.targetTypeMicro, g.targetTypeMicro);
  tallyMulti('social_policy_sector', s.socialPolicySector, g.socialPolicySector);
  tallySingle('external_verification', s.externalVerification, g.externalVerification);
  tallyMulti('sharer_job', s.sharerJob, g.sharerJob);

  const pct = Math.round((fullCount/totalGraded)*100);
  const cls = pct>=85 ? 'pass' : (pct>=50 ? 'partial' : 'fail');

  let narrative = `<div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;">
    <b>Narrative fields (self-check: phrasing varies, so compare rather than "pass/fail"):</b><br>
    <i>Your hero:</i> ${s.hero||'(blank)'} <br><i>Gold-standard hero:</i> ${g.hero}<br><br>
    <i>Your villain:</i> ${s.villain||'(blank)'} <br><i>Gold-standard villain:</i> ${g.villain}<br><br>
    <i>Your plot:</i> ${s.plot||'(blank)'} <br><i>Gold-standard plot:</i> ${g.plot}<br><br>
    <i>Your moral:</i> ${s.moral||'(blank)'} <br><i>Gold-standard moral:</i> ${g.moral}
  </div>`;

  const box = document.getElementById('grade-'+incId);
  box.className = 'gradebox show '+cls;
  box.innerHTML = `<div class="scoresummary">${pct}% on graded fields (${fullCount}/${totalGraded})</div>${rows.join('')}${narrative}`;

  const prevSent = progressCache[STORAGE_PREFIX+'practice:'+incId] && progressCache[STORAGE_PREFIX+'practice:'+incId].sent;
  saveProgress('practice:'+incId, {pct, score:fullCount, total:totalGraded, sent: !!prevSent}).then(renderSidebar);

  const sendReminder = document.getElementById('psendreminder-'+incId);
  const sendBtn = document.getElementById('psendbtn-'+incId);
  const sendMsg = document.getElementById('psendmsg-'+incId);
  sendBtn.style.display = 'inline-block';
  if(prevSent){
    sendReminder.style.display = 'none';
    sendMsg.textContent = 'Score already sent to the team for this report.';
    sendMsg.classList.add('show');
  } else {
    sendReminder.style.display = 'block';
  }
}

/* ---------- Progress view ---------- */
function renderProgressView(){
  let html = `
  <div class="eyebrow">Your progress</div>
  <h2 class="title">Where you\u2019re at</h2>
  <div class="card">`;
  CODEBOOK.modules.forEach(m=>{
    const p = progressCache[STORAGE_PREFIX+'quiz:'+m.id];
    const complete = p && p.score === p.total;
    const needsSending = complete && !p.sent;
    html += `<div class="progressrow"><span>Module ${m.num}. ${m.title}</span>
      <span>${needsSending ? `<span class="pill" style="background:var(--red-bg);color:var(--red);margin-right:6px;">send score</span>` : ''}<span class="pill ${p?'done':''}">${p ? p.score+'/'+p.total : 'not started'}</span></span></div>`;
  });
  PRACTICE_INCIDENTS.forEach(inc=>{
    const p = progressCache[STORAGE_PREFIX+'practice:'+inc.id];
    const needsSending = p && !p.sent;
    html += `<div class="progressrow"><span>Practice Lab: report ${inc.reportId}</span>
      <span>${needsSending ? `<span class="pill" style="background:var(--red-bg);color:var(--red);margin-right:6px;">send score</span>` : ''}<span class="pill ${p?'done':''}">${p ? p.pct+'%' : 'not attempted'}</span></span></div>`;

  html += `</div>
  <button class="actionbtn" id="resetbtn" style="background:var(--red);">Reset all progress</button>`;

}

/* ---------- top-level render ---------- */
function render(){
  renderSidebar();
  const main = document.getElementById('main');
  if(currentView==='home') main.innerHTML = renderHome();
  else if(currentView==='expectations') main.innerHTML = renderExpectations();
  else if(currentView==='airtable') main.innerHTML = renderAirtableGuide();
  else if(currentView==='practice'){ main.innerHTML = renderPractice(); wirePractice(); }
  else if(currentView==='progress'){
    main.innerHTML = renderProgressView();
    const rb = document.getElementById('resetbtn');
    if(rb) rb.addEventListener('click', resetProgress);
  }
  else if(currentView.startsWith('mod:')){
    const id = currentView.slice(4);
    const m = CODEBOOK.modules.find(x=>x.id===id);
    main.innerHTML = renderModule(m);
    wireModuleQuiz(m);
  }
  window.scrollTo(0,0);
}
